<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: common-head}"></th:block>
    <title th:text="${detail.fullName()} + ' - Painel'"></title>
</head>
<body>
<main class="container app-wide py-4">
    <a href="/admin/dashboard" class="btn btn-sm btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Voltar ao painel
    </a>

    <div class="card mb-4">
        <div class="card-body">
            <h1 class="mb-1 fs-2" th:text="${detail.fullName()}"></h1>
            <p class="text-muted mb-3">
                <span th:text="${detail.ageRangeLabel()}"></span>
                <span th:if="${detail.phone()}"> · <span th:text="${detail.phone()}"></span></span>
            </p>
            <span class="badge text-bg-primary fs-6 px-3 py-2" th:if="${detail.quizScore() != null}"
                  th:text="'Quiz: ' + ${detail.quizScore()} + '/' + ${detail.quizTotal()}"></span>
            <span class="badge text-bg-secondary fs-6 px-3 py-2" th:unless="${detail.quizScore() != null}">
                Quiz: não concluído
            </span>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-header fw-semibold">Questionário inicial</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item" th:each="answer : ${detail.initialAnswers()}">
                        <strong th:text="${answer.questionText()}"></strong><br/>
                        <span class="text-muted" th:text="${answer.selectedOptionText()}"></span>
                    </li>
                </ul>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-header fw-semibold">Respostas do quiz</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item" th:each="answer : ${detail.quizAnswers()}">
                        <strong th:text="${answer.questionText()}"></strong><br/>
                        <span class="text-muted" th:text="${answer.selectedOptionText()}"></span>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/scripts :: bootstrap-js}"></th:block>
</body>
</html>
