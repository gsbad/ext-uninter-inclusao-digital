<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: common-head}"></th:block>
    <title>Materiais Educativos - Inclusão Digital</title>
</head>
<body>
<main class="container app-narrow py-4">
    <div class="wizard-progress mb-2"><div style="width: 75%"></div></div>
    <p class="text-center text-muted mb-4">Passo 3 de 4</p>
    <h1 class="text-center mb-4 fs-2">Vamos aprender um pouco?</h1>

    <div class="d-flex flex-column gap-3 mb-4">
        <a th:each="topic : ${topics}" th:href="@{'/oficina/materiais/' + ${topic.slug}}"
           class="btn btn-outline-primary btn-lg fs-3 py-3 text-start">
            <i th:class="'bi ' + ${topic.iconClass} + ' me-2'" aria-hidden="true"></i>
            <span th:text="${topic.title}"></span>
        </a>
    </div>

    <div class="text-center">
        <a href="/oficina/quiz" class="btn btn-primary btn-lg px-5 py-3 fs-3">
            Ir para o Quiz <i class="bi bi-arrow-right-circle" aria-hidden="true"></i>
        </a>
    </div>
</main>
<th:block th:replace="~{fragments/scripts :: bootstrap-js}"></th:block>
</body>
</html>
