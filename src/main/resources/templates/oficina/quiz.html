<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: common-head}"></th:block>
    <title>Quiz - Inclusão Digital</title>
</head>
<body>
<main class="container" style="max-width: 640px;">
    <p class="text-center text-muted mt-4 mb-1">Passo 4 de 4</p>
    <p class="text-center text-muted mb-3"
       th:text="'Pergunta ' + ${currentPosition} + ' de ' + ${totalQuestions}"></p>

    <h1 class="text-center mb-4 fs-2" th:text="${question.text}"></h1>

    <form th:action="@{/oficina/quiz}" method="post">
        <input type="hidden" name="questionId" th:value="${question.id}"/>

        <div class="d-flex flex-column gap-3 mb-3">
            <div th:each="option : ${question.options}">
                <input type="radio" class="btn-check" name="optionId" th:id="${'option-' + option.id}"
                       th:value="${option.id}" autocomplete="off"/>
                <label class="btn btn-outline-primary btn-lg w-100 fs-3 py-3"
                       th:for="${'option-' + option.id}" th:text="${option.text}"></label>
            </div>
        </div>

        <p class="text-danger fs-5 text-center mb-3" th:if="${erro}" th:text="${erro}"></p>

        <div class="text-center">
            <button type="submit" class="btn btn-primary btn-lg px-5 py-3 fs-3">Próximo</button>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/scripts :: bootstrap-js}"></th:block>
</body>
</html>
