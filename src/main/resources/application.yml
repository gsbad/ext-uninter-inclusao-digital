spring:
  application:
    name: inclusao-digital

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inclusao_digital}
    username: ${DB_USER:inclusao_digital}
    password: ${DB_PASSWORD:inclusao_digital}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:8080}
